<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大肥魚的台股理財茶會｜動態女僕小助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: radial-gradient(circle at top right, #e0f2fe 0%, #f0f9ff 45%, #f8fafc 100%);
      color: #0f172a;
      overflow-x: hidden;
    }
    .tw-up { color: #e11d48; }
    .tw-up-bg { background-color: #fff1f2; color: #e11d48; border-color: #fecdd3; }
    .tw-down { color: #059669; }
    .tw-down-bg { background-color: #ecfdf5; color: #059669; border-color: #a7f3d0; }

    .maid-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1.5px solid #bae6fd;
      box-shadow: 0 8px 24px -6px rgba(14, 116, 144, 0.08);
    }

    /* 活潑呼吸與左右微搖擺動畫 */
    @keyframes cuteSway {
      0%, 100% { transform: translateY(0px) rotate(-1.8deg) scale(1); }
      25% { transform: translateY(-5px) rotate(0deg) scale(1.015, 0.99); }
      50% { transform: translateY(0px) rotate(1.8deg) scale(1); }
      75% { transform: translateY(-5px) rotate(0deg) scale(0.99, 1.015); }
    }
    .anim-cute-sway {
      animation: cuteSway 3.4s ease-in-out infinite;
      transform-origin: bottom center;
    }

    /* 走路散步時的輕快小碎步彈跳 */
    @keyframes walkStep {
      0%, 100% { transform: translateY(0px) rotate(-3.5deg); }
      50% { transform: translateY(-11px) rotate(3.5deg); }
    }
    .is-walking-step {
      animation: walkStep 0.5s ease-in-out infinite;
    }

    /* 點擊開心大跳躍 */
    @keyframes happyJump {
      0% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-28px) scale(1.07, 0.94); }
      60% { transform: translateY(0) scale(0.94, 1.06); }
      80% { transform: translateY(-10px) scale(1.03); }
      100% { transform: translateY(0) scale(1); }
    }
    .jump-active {
      animation: happyJump 0.65s cubic-bezier(0.28, 0.84, 0.42, 1) !important;
    }

    /* 說話時嘴巴開合動畫 */
    @keyframes mouthTalk {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1.15); }
    }
    .is-talking .anim-mouth {
      animation: mouthTalk 0.26s ease-in-out infinite;
      transform-origin: 48.5% 65.2%;
    }

    /* 自然定時眨眼（用膚色眼皮蓋下） */
    @keyframes eyelidBlink {
      0%, 92%, 100% { opacity: 0; }
      95% { opacity: 1; }
    }
    .anim-auto-blink {
      animation: eyelidBlink 4.2s infinite;
    }

    /* 頭頂情緒掛件漂浮 */
    @keyframes badgePop {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.12); }
    }
    .anim-mood-badge {
      animation: badgePop 1.8s ease-in-out infinite;
    }

    #petContainer { transition: right 2.2s ease-in-out, bottom 0.4s ease; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-36">

  <!-- 頂部導覽列 -->
  <header class="bg-[#0f172a]/95 text-white backdrop-blur-md border-b-2 border-amber-400/70 sticky top-0 z-20 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-sky-400 to-blue-700 border-2 border-white/80 text-white flex items-center justify-center font-black text-xl shadow-sm">
          🐋
        </div>
        <div>
          <h1 class="text-lg font-black tracking-tight flex items-center gap-2">
            大肥魚的台股理財茶會
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-200 border border-sky-400/40">動態女僕版</span>
          </h1>
          <p class="text-xs text-sky-200/80">行情同步時間：<span id="updatedAtText" class="font-bold text-amber-300">載入中...</span></p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 flex-wrap">
        <span id="dataStatusBadge" class="text-xs px-3 py-1.5 rounded-full bg-sky-900/80 text-sky-200 border border-sky-400/50 font-bold">
          ● 已連線台股資料庫
        </span>
        <button id="liveRefreshBtn" onclick="fetchLiveFromBrowser(true)"
          class="text-xs px-3.5 py-1.5 rounded-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-black shadow-sm transition flex items-center gap-1 cursor-pointer">
          <span id="refreshIcon">🔄</span> 立即抓取盤中最新價
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto w-full px-4 py-6 space-y-6 flex-1">

    <!-- 區塊 1：加權指數多週期波動看板 -->
    <section class="maid-card rounded-3xl p-5 md:p-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-sky-100">
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-bold px-2.5 py-0.5 rounded-lg bg-blue-950 text-white">台灣加權指數 (^TWII)</span>
            <span id="marketMoodBadge" class="text-xs font-bold px-2.5 py-0.5 rounded-full border">--</span>
          </div>
          <div class="mt-2 flex items-baseline gap-3 flex-wrap">
            <span id="indexPrice" class="text-3xl md:text-4xl font-black tracking-tight">--</span>
            <span id="indexChange" class="text-lg font-bold">--</span>
          </div>
        </div>

        <div class="flex flex-col sm:items-end gap-3">
          <div class="inline-flex p-1 rounded-xl bg-sky-100/80 border border-sky-200">
            <button type="button" data-range="1d" onclick="switchRange('1d')"
              class="range-btn px-3.5 py-1.5 rounded-lg text-xs font-bold bg-blue-900 text-white shadow-xs transition">
              當日走勢
            </button>
            <button type="button" data-range="5d" onclick="switchRange('5d')"
              class="range-btn px-3.5 py-1.5 rounded-lg text-xs font-bold text-blue-900 hover:bg-white/60 transition">
              本週 (5日)
            </button>
            <button type="button" data-range="1mo" onclick="switchRange('1mo')"
              class="range-btn px-3.5 py-1.5 rounded-lg text-xs font-bold text-blue-900 hover:bg-white/60 transition">
              本月 (30日)
            </button>
          </div>

          <div class="grid grid-cols-3 gap-3 bg-sky-50/90 px-3.5 py-2.5 rounded-2xl border border-sky-100 text-xs">
            <div>
              <div id="labelOpen" class="text-slate-500">今日開盤</div>
              <div id="indexOpen" class="font-bold text-slate-900 mt-0.5">--</div>
            </div>
            <div>
              <div id="labelBase" class="text-slate-500">昨日收盤</div>
              <div id="indexPrevClose" class="font-bold text-slate-900 mt-0.5">--</div>
            </div>
            <div>
              <div class="text-slate-500">海象溫度計</div>
              <div id="marketTemp" class="font-bold mt-0.5">--</div>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-4">
        <div class="flex items-center justify-between text-xs text-slate-500 mb-2">
          <span id="chartSubtitle">當日盤中走勢圖（虛線為基準平盤線）</span>
          <span class="font-medium text-blue-900">紅漲綠跌（台灣股市標準）</span>
        </div>
        <div class="h-60 w-full">
          <canvas id="marketChart"></canvas>
        </div>
      </div>
    </section>

    <!-- 區塊 2：小資預算輸入與策略選擇 -->
    <section class="maid-card rounded-3xl p-5 md:p-6">
      <h2 class="text-base font-black text-blue-950 mb-4 flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-gradient-to-r from-blue-700 to-sky-500 text-white text-xs flex items-center justify-center shadow-2xs">1</span>
        請輸入主人本次打算投入的金額與偏好
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-end">
        <div class="md:col-span-6">
          <label class="block text-xs font-bold text-slate-600 mb-1.5">投入預算（新台幣元）</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-blue-700 font-bold">NT$</span>
            <input id="budgetInput" type="number" min="1000" step="500" value="10000"
              class="w-full pl-12 pr-4 py-2.5 text-lg font-black border-2 border-sky-200 rounded-2xl bg-white focus:outline-none focus:border-blue-600 transition" />
          </div>
          <div class="flex flex-wrap gap-2 mt-2.5">
            <button type="button" onclick="setBudget(3000)" class="text-xs px-3 py-1 rounded-xl bg-sky-50 hover:bg-sky-100 text-blue-900 border border-sky-200 font-bold transition">3,000 元</button>
            <button type="button" onclick="setBudget(5000)" class="text-xs px-3 py-1 rounded-xl bg-sky-50 hover:bg-sky-100 text-blue-900 border border-sky-200 font-bold transition">5,000 元</button>
            <button type="button" onclick="setBudget(10000)" class="text-xs px-3 py-1 rounded-xl bg-sky-50 hover:bg-sky-100 text-blue-900 border border-sky-200 font-bold transition">10,000 元</button>
            <button type="button" onclick="setBudget(30000)" class="text-xs px-3 py-1 rounded-xl bg-sky-50 hover:bg
